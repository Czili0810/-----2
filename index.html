<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系 3D 模拟器</title>
<style>
  /* ============================================
     NASA 控制中心风格 — Mission Control UI
     ============================================ */
  :root {
    --bg-deep: #050d16;
    --panel-bg: rgba(6, 14, 30, 0.94);
    --panel-border: rgba(0, 160, 220, 0.3);
    --glow-cyan: rgba(0, 180, 230, 0.45);
    --glow-blue: rgba(20, 120, 220, 0.35);
    --text-primary: #d8e4f0;
    --text-secondary: #7b9bc0;
    --accent: #00c8f0;
    --accent-dim: #0088b8;
    --info-row-bg: rgba(0, 160, 220, 0.06);
    --info-row-border: rgba(0, 160, 220, 0.12);
    --font-tech: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Microsoft YaHei', monospace;
    --font-ui: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    overflow: hidden;
    font-family: var(--font-ui);
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 微弱扫描线纹理 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.03) 2px,
      rgba(0, 0, 0, 0.03) 4px
    );
    opacity: 0.5;
  }

  canvas { display: block; }

  /* ===== 顶部标题栏 ===== */
  #title-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 16px 24px;
    background: linear-gradient(180deg, rgba(5,13,22,0.95) 50%, transparent);
    z-index: 10;
    pointer-events: none;
    border-bottom: 1px solid rgba(0, 160, 220, 0.12);
  }
  #title-bar h1 {
    color: #d8ecff;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: var(--font-tech);
  }
  #title-bar h1::before {
    content: '◆ ';
    color: var(--accent);
    font-size: 0.9rem;
    vertical-align: middle;
  }
  #title-bar .subtitle {
    color: var(--text-secondary);
    font-size: 0.68rem;
    margin-top: 3px;
    letter-spacing: 0.1em;
    font-family: var(--font-tech);
    text-transform: uppercase;
  }
  #title-bar .subtitle::before {
    content: 'MISSION CONTROL — ';
    color: var(--accent-dim);
  }

  /* ===== 行星信息面板 ===== */
  #info-panel {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%) translateX(120%);
    width: 310px;
    max-height: 75vh;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 22px 20px 18px;
    z-index: 20;
    color: var(--text-primary);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 0 30px rgba(0, 150, 220, 0.12),
      0 0 80px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(0, 200, 255, 0.08);
    transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
    overflow-y: auto;
  }
  #info-panel.visible { transform: translateY(-50%) translateX(0); }

  /* 面板顶部发光条 */
  #info-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 10px; right: 10px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  #info-panel .close-btn {
    position: absolute;
    top: 8px; right: 10px;
    background: rgba(0, 180, 230, 0.08);
    border: 1px solid rgba(0, 180, 230, 0.2);
    color: var(--text-secondary);
    font-size: 1rem;
    width: 26px; height: 26px;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  #info-panel .close-btn:hover {
    color: #fff;
    background: rgba(220, 50, 50, 0.25);
    border-color: rgba(220, 50, 50, 0.5);
    box-shadow: 0 0 10px rgba(220, 50, 50, 0.3);
  }

  #info-panel .planet-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    margin: 6px auto 10px;
    display: block;
    box-shadow: 0 0 22px var(--glow-cyan), 0 0 50px rgba(0, 150, 220, 0.15);
    border: 1px solid rgba(0, 200, 255, 0.2);
  }

  #info-panel .planet-name {
    text-align: center;
    font-size: 1.4rem;
    font-weight: 600;
    color: #e0f0ff;
    letter-spacing: 0.06em;
    font-family: var(--font-tech);
  }
  #info-panel .planet-name-en {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-secondary);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: var(--font-tech);
    margin-bottom: 14px;
  }

  #info-panel .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--info-row-border);
    border: 1px solid var(--info-row-border);
    border-radius: 3px;
    overflow: hidden;
  }
  #info-panel .info-item {
    background: var(--info-row-bg);
    padding: 7px 10px;
    font-size: 0.72rem;
  }
  #info-panel .info-label {
    color: var(--text-secondary);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-family: var(--font-tech);
    margin-bottom: 2px;
  }
  #info-panel .info-value {
    color: #c8e0ff;
    font-family: var(--font-tech);
    font-size: 0.78rem;
  }

  #info-panel .fact {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(0, 180, 220, 0.05);
    border-left: 2px solid var(--accent-dim);
    border-radius: 0 3px 3px 0;
    font-size: 0.73rem;
    color: #a0c4e0;
    line-height: 1.55;
  }
  #info-panel .fact::before {
    content: 'MISSION NOTE ';
    display: block;
    font-size: 0.58rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    font-family: var(--font-tech);
    margin-bottom: 4px;
    font-weight: 600;
  }

  /* ===== 底部提示栏 ===== */
  #hint-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 18px;
    z-index: 10;
    pointer-events: none;
  }
  .hint {
    color: rgba(120, 170, 210, 0.5);
    font-size: 0.66rem;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.04em;
    font-family: var(--font-tech);
  }
  .hint .key {
    display: inline-block;
    background: rgba(0, 160, 220, 0.12);
    border: 1px solid rgba(0, 160, 220, 0.25);
    border-radius: 2px;
    padding: 0px 5px;
    font-size: 0.6rem;
    color: var(--accent);
    font-family: var(--font-tech);
  }

  /* ===== 控制面板 (NASA 风格) ===== */
  #ctrl-bar {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 15;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 6px 10px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 0 25px rgba(0, 150, 220, 0.1),
      0 4px 20px rgba(0, 0, 0, 0.5);
  }
  #ctrl-bar::before {
    content: '';
    position: absolute;
    top: 0; left: 8px; right: 8px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 200, 255, 0.4), transparent);
  }

  .ctrl-btn {
    width: 30px; height: 30px;
    border-radius: 3px;
    border: 1px solid rgba(0, 180, 230, 0.18);
    background: rgba(0, 150, 220, 0.06);
    color: #8ab8d8;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    line-height: 1;
    padding: 0;
    font-family: var(--font-tech);
  }
  .ctrl-btn:hover {
    background: rgba(0, 180, 230, 0.16);
    border-color: rgba(0, 200, 255, 0.45);
    color: #d0f0ff;
    box-shadow: 0 0 12px rgba(0, 180, 230, 0.25);
  }
  .ctrl-btn.active {
    background: rgba(0, 200, 255, 0.14);
    border-color: var(--accent);
    color: #e0f8ff;
    box-shadow: 0 0 16px rgba(0, 200, 255, 0.35), inset 0 0 8px rgba(0, 200, 255, 0.08);
  }

  .ctrl-sep {
    width: 1px; height: 16px;
    background: linear-gradient(180deg, transparent, rgba(0, 180, 230, 0.25), transparent);
    margin: 0 1px;
  }

  .speed-display {
    color: var(--accent);
    font-size: 0.72rem;
    min-width: 38px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-family: var(--font-tech);
    letter-spacing: 0.04em;
    text-shadow: 0 0 8px rgba(0, 200, 255, 0.4);
  }

  /* 滚动条 */
  #info-panel::-webkit-scrollbar { width: 4px; }
  #info-panel::-webkit-scrollbar-track { background: transparent; }
  #info-panel::-webkit-scrollbar-thumb {
    background: rgba(0, 180, 230, 0.2);
    border-radius: 2px;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 600px) {
    #info-panel {
      right: 4px; left: 4px; width: auto;
      max-height: 55vh;
      bottom: 10px; top: auto;
      transform: translateY(120%);
    }
    #info-panel.visible { transform: translateY(0); }
    #title-bar h1 { font-size: 1.05rem; }
    #ctrl-bar { gap: 2px; padding: 5px 7px; }
    .ctrl-btn { width: 28px; height: 28px; font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div id="title-bar">
  <h1>☀ 太阳系模拟器</h1>
  <div class="subtitle">Solar System · Three.js · Bloom</div>
</div>

<div id="info-panel">
  <button class="close-btn" title="关闭">✕</button>
  <canvas class="planet-icon" width="64" height="64" id="planet-icon"></canvas>
  <div class="planet-name" id="p-name">--</div>
  <div class="planet-name-en" id="p-name-en">--</div>
  <div class="info-grid">
    <div class="info-item"><div class="info-label">类型</div><div class="info-value" id="p-type">--</div></div>
    <div class="info-item"><div class="info-label">半径</div><div class="info-value" id="p-radius">--</div></div>
    <div class="info-item"><div class="info-label">质量</div><div class="info-value" id="p-mass">--</div></div>
    <div class="info-item"><div class="info-label">密度</div><div class="info-value" id="p-density">--</div></div>
    <div class="info-item"><div class="info-label">表面重力</div><div class="info-value" id="p-gravity">--</div></div>
    <div class="info-item"><div class="info-label">表面温度</div><div class="info-value" id="p-temp">--</div></div>
    <div class="info-item"><div class="info-label">公转周期</div><div class="info-value" id="p-orbit">--</div></div>
    <div class="info-item"><div class="info-label">自转周期</div><div class="info-value" id="p-rot">--</div></div>
    <div class="info-item"><div class="info-label">卫星数量</div><div class="info-value" id="p-moons">--</div></div>
    <div class="info-item"><div class="info-label">距太阳距离</div><div class="info-value" id="p-dist">--</div></div>
  </div>
  <div class="fact" id="p-fact">点击行星查看详情</div>
</div>

<div id="hint-bar">
  <span class="hint"><span class="key">🖱 拖拽</span> 旋转视角</span>
  <span class="hint"><span class="key">🖱 滚轮</span> 缩放</span>
  <span class="hint"><span class="key">🖱 点击</span> 查看信息</span>
</div>

<div id="ctrl-bar">
  <button class="ctrl-btn" id="btn-play" title="播放 / 暂停">▶</button>
  <span class="ctrl-sep"></span>
  <button class="ctrl-btn" id="btn-slower" title="减速">⏪</button>
  <span class="speed-display" id="speed-label">1.0×</span>
  <button class="ctrl-btn" id="btn-faster" title="加速">⏩</button>
  <span class="ctrl-sep"></span>
  <button class="ctrl-btn" id="btn-orbits" title="显示/隐藏轨道线">◎</button>
  <button class="ctrl-btn" id="btn-labels" title="显示/隐藏标签">🏷</button>
  <span class="ctrl-sep"></span>
  <span class="ctrl-sep"></span>
  <button class="ctrl-btn mode-btn active" data-mode="orbit" title="轨道观察模式">◎</button>
  <button class="ctrl-btn mode-btn" data-mode="focus" title="行星聚焦模式 (点击行星聚焦)">⊙</button>
  <button class="ctrl-btn mode-btn" data-mode="follow" title="行星跟随模式 (点击行星跟随)">◉</button>
  <button class="ctrl-btn mode-btn" data-mode="free" title="自由飞行模式 (WASD飞行)">✈</button>
  <span class="ctrl-sep"></span>
  <button class="ctrl-btn" id="btn-tour" title="自动巡航">🚀</button>
  <button class="ctrl-btn" id="btn-reset" title="重置视角">↺</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

/** 生成带噪点的颜色 */
function noise(ctx, x, y, scale, alpha) {
  // 简单的伪随机噪声
  const v = (Math.sin(x * 12.9898 + y * 78.233 + scale * 437.58) * 43758.5453) % 1;
  return Math.abs(v) * alpha;
}

/** 生成太阳纹理 (1024×512) */
function createSunTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size / 2;
  const ctx = c.getContext('2d');
  const w = size, h = size / 2;

  // 多层径向渐变模拟光球
  const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  grad.addColorStop(0, '#fffff8');
  grad.addColorStop(0.04, '#ffffcc');
  grad.addColorStop(0.12, '#ffe880');
  grad.addColorStop(0.28, '#ffcc44');
  grad.addColorStop(0.5, '#ff9922');
  grad.addColorStop(0.72, '#ee6611');
  grad.addColorStop(0.9, '#cc3300');
  grad.addColorStop(0.97, '#991100');
  grad.addColorStop(1, '#660800');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 太阳表面颗粒感
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (Math.random() - 0.5) * 18;
    data[i] = Math.min(255, Math.max(0, data[i] + n));
    data[i+1] = Math.min(255, Math.max(0, data[i+1] + n * 0.7));
    data[i+2] = Math.min(255, Math.max(0, data[i+2] + n * 0.3));
  }
  ctx.putImageData(imageData, 0, 0);

  // 黑子群
  for (let i = 0; i < 15; i++) {
    const cx = w * 0.2 + Math.random() * w * 0.6;
    const cy = h * 0.2 + Math.random() * h * 0.6;
    // 黑子本影
    ctx.beginPath();
    ctx.arc(cx, cy, 4 + Math.random() * 10, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(80,40,10,${0.3 + Math.random() * 0.5})`;
    ctx.fill();
    // 半影
    ctx.beginPath();
    ctx.arc(cx, cy, 8 + Math.random() * 16, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(150,100,30,${0.15 + Math.random() * 0.25})`;
    ctx.fill();
  }

  // 明亮区域 (光斑)
  for (let i = 0; i < 50; i++) {
    const bx = Math.random() * w;
    const by = Math.random() * h;
    const br = 2 + Math.random() * 8;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,220,${Math.random() * 0.45})`;
    ctx.fill();
  }

  return new THREE.CanvasTexture(c);
}

/** 生成岩石行星纹理 */
function createRockyTexture(baseColor, features = 'default', size = 2048) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size / 2;
  const ctx = c.getContext('2d');
  const w = size, h = size / 2;
  const rgb = hexToRgb(baseColor);

  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, w, h);

  if (features === 'earth') {
    // ===== 地球 =====
    // 海洋
    const oceanGrad = ctx.createLinearGradient(0, 0, 0, h);
    oceanGrad.addColorStop(0, '#2255aa');
    oceanGrad.addColorStop(0.3, '#3366cc');
    oceanGrad.addColorStop(0.5, '#4488dd');
    oceanGrad.addColorStop(0.7, '#3366cc');
    oceanGrad.addColorStop(1, '#2255aa');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, w, h);

    // 大陆不规则形状
    const continents = [
      { cx: 0.55, cy: 0.32, pts: [{dx:0,dy:-0.14},{dx:0.1,dy:-0.08},{dx:0.14,dy:0},{dx:0.1,dy:0.1},{dx:0,dy:0.14},{dx:-0.08,dy:0.1},{dx:-0.12,dy:0},{dx:-0.06,dy:-0.08}] },
      { cx: 0.22, cy: 0.42, pts: [{dx:0,dy:-0.1},{dx:0.08,dy:-0.05},{dx:0.1,dy:0.05},{dx:0.04,dy:0.1},{dx:-0.06,dy:0.08},{dx:-0.1,dy:0},{dx:-0.06,dy:-0.08}] },
      { cx: 0.38, cy: 0.38, pts: [{dx:0,dy:-0.06},{dx:0.05,dy:0},{dx:0.04,dy:0.06},{dx:-0.03,dy:0.04},{dx:-0.05,dy:-0.02}] },
      { cx: 0.8, cy: 0.55, pts: [{dx:0,dy:-0.05},{dx:0.04,dy:-0.02},{dx:0.05,dy:0.03},{dx:0,dy:0.05},{dx:-0.04,dy:0}] },
      { cx: 0.48, cy: 0.88, pts: [{dx:0,dy:-0.03},{dx:0.2,dy:0},{dx:0,dy:0.03},{dx:-0.2,dy:0}] },
    ];

    continents.forEach(cont => {
      ctx.beginPath();
      ctx.moveTo((cont.cx + cont.pts[0].dx) * w, (cont.cy + cont.pts[0].dy) * h);
      for (let i = 1; i < cont.pts.length; i++) {
        const px = (cont.cx + cont.pts[i].dx) * w;
        const py = (cont.cy + cont.pts[i].dy) * h;
        ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = `rgb(${55 + Math.random()*35},${125 + Math.random()*45},${45 + Math.random()*35})`;
      ctx.fill();

      // 地形细节
      for (let j = 0; j < 60; j++) {
        const dp = cont.pts[Math.floor(Math.random() * cont.pts.length)];
        const dx = (cont.cx + dp.dx * (0.2 + Math.random() * 0.8)) * w;
        const dy = (cont.cy + dp.dy * (0.2 + Math.random() * 0.8)) * h;
        ctx.beginPath();
        ctx.arc(dx, dy, Math.random() * 12 + 1, 0, Math.PI * 2);
        const shade = Math.random() > 0.5 ? '70,150,60' : '110,155,80';
        ctx.fillStyle = `rgba(${shade},${0.3 + Math.random() * 0.4})`;
        ctx.fill();
      }
    });

    // 冰雪覆盖
    const iceGradTop = ctx.createLinearGradient(0, 0, 0, h * 0.1);
    iceGradTop.addColorStop(0, 'rgba(245,250,255,0.9)');
    iceGradTop.addColorStop(0.5, 'rgba(240,245,255,0.4)');
    iceGradTop.addColorStop(1, 'rgba(240,245,255,0)');
    ctx.fillStyle = iceGradTop;
    ctx.fillRect(0, 0, w, h * 0.1);

    const iceGradBot = ctx.createLinearGradient(0, h * 0.88, 0, h);
    iceGradBot.addColorStop(0, 'rgba(240,245,255,0)');
    iceGradBot.addColorStop(0.5, 'rgba(240,245,255,0.5)');
    iceGradBot.addColorStop(1, 'rgba(245,250,255,0.9)');
    ctx.fillStyle = iceGradBot;
    ctx.fillRect(0, h * 0.88, w, h * 0.12);

    // 云层
    for (let i = 0; i < 120; i++) {
      const cx = Math.random() * w;
      const cy = Math.random() * h;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.random() * 18 + 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.12})`;
      ctx.fill();
    }
  } else if (features === 'mars') {
    // ===== 火星 =====
    // 颜色变化
    for (let i = 0; i < 300; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const r = Math.random() * 18 + 2;
      const v = (Math.random() - 0.5) * 45;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${clamp(rgb.r+v)},${clamp(rgb.g+v*0.5)},${clamp(rgb.b+v*0.3)},${Math.random()*0.45})`;
      ctx.fill();
    }

    // 暗色玄武岩区域
    for (let i = 0; i < 40; i++) {
      ctx.beginPath();
      ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 22 + 4, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100,25,8,${Math.random() * 0.45})`;
      ctx.fill();
    }

    // 极冠
    ctx.fillStyle = 'rgba(240,242,250,0.55)';
    ctx.fillRect(0, 0, w, h * 0.06);
    ctx.fillRect(0, h * 0.93, w, h * 0.07);

    // 陨石坑
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const r = Math.random() * 5 + 1;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,0,0,${Math.random()*0.35})`;
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
  } else if (features === 'venus') {
    // ===== 金星 =====
    for (let i = 0; i < 250; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const r = Math.random() * 20 + 3;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,240,210,${Math.random()*0.22})`;
      ctx.fill();
    }
    // 暗色云带
    for (let i = 0; i < 8; i++) {
      const y = (i / 7) * h;
      ctx.beginPath();
      ctx.moveTo(0, y - 5);
      ctx.quadraticCurveTo(w/2, y + (Math.random()-0.5)*12, w, y + 5);
      ctx.lineTo(w, y + 12);
      ctx.quadraticCurveTo(w/2, y + 8 + (Math.random()-0.5)*14, 0, y + 6);
      ctx.fillStyle = `rgba(200,170,120,0.08)`;
      ctx.fill();
    }
  } else {
    // ===== 水星 / 通用岩石 =====
    for (let i = 0; i < 300; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const r = Math.random() * 15 + 2;
      const v = (Math.random() - 0.5) * 50;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${clamp(rgb.r+v)},${clamp(rgb.g+v)},${clamp(rgb.b+v)},${Math.random()*0.5})`;
      ctx.fill();
    }
    // 陨石坑
    for (let i = 0; i < 100; i++) {
      const x = Math.random() * w, y = Math.random() * h;
      const r = Math.random() * 6 + 1;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(0,0,0,${Math.random()*0.35})`;
      ctx.lineWidth = 0.5;
      ctx.stroke();
      // 坑内阴影
      ctx.fillStyle = `rgba(0,0,0,${Math.random()*0.15})`;
      ctx.fill();
    }
  }

  return new THREE.CanvasTexture(c);
}

/** 生成气态巨行星纹理 (1024×512 高分辨率) */
function createGasGiantTexture(bands, size = 2048) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size / 2;
  const ctx = c.getContext('2d');
  const w = size, h = size / 2;

  // 基底
  ctx.fillStyle = bands[0];
  ctx.fillRect(0, 0, w, h);

  // 柔和条纹
  const bandCount = bands.length;
  for (let i = 0; i < bandCount; i++) {
    const y = (i / (bandCount - 1)) * h;
    const bandH = (h / bandCount) * 1.5;
    const grad = ctx.createLinearGradient(0, y - bandH/2, 0, y + bandH/2);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.35, bands[i]);
    grad.addColorStop(0.65, bands[i]);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, y - bandH/2, w, bandH);
  }

  // 湍流/涡旋细节
  for (let i = 0; i < 250; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const rx = Math.random() * 35 + 3;
    const ry = Math.random() * 4 + 0.5;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
    const bright = Math.random() > 0.5;
    ctx.fillStyle = bright
      ? `rgba(255,255,240,${Math.random() * 0.12})`
      : `rgba(150,120,80,${Math.random() * 0.1})`;
    ctx.fill();
  }

  // 小涡旋
  for (let i = 0; i < 100; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    ctx.beginPath();
    ctx.arc(x, y, Math.random() * 8 + 1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${Math.random()>0.5?'255,240,200':'180,140,80'},${Math.random()*0.2})`;
    ctx.fill();
  }

  return new THREE.CanvasTexture(c);
}

/** 生成土星环纹理 (1024×64 径向条带, alpha 驱动透明度) */
function createRingTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = 64;
  const ctx = c.getContext('2d');
  const w = size;

  // 辅助：绘制径向渐变带
  function gradientBand(x0, x1, colorStops) {
    const grad = ctx.createLinearGradient(x0, 0, x1, 0);
    colorStops.forEach(([pos, color]) => grad.addColorStop(pos, color));
    ctx.fillStyle = grad;
    ctx.fillRect(x0, 0, x1 - x0 + 1, 64);
  }

  // ---- D 环 (最内层, 极暗淡) ----
  gradientBand(0, w * 0.05, [
    [0, 'rgba(170,150,120,0.0)'],
    [0.5, 'rgba(185,160,130,0.06)'],
    [1, 'rgba(190,168,138,0.0)'],
  ]);

  // ---- C 环 (半透明, 灰白) ----
  gradientBand(w * 0.04, w * 0.17, [
    [0, 'rgba(175,155,125,0.01)'],
    [0.15, 'rgba(195,172,142,0.18)'],
    [0.45, 'rgba(205,182,152,0.25)'],
    [0.7, 'rgba(195,172,142,0.16)'],
    [1, 'rgba(180,158,128,0.02)'],
  ]);

  // ---- C-B 间隙 ----
  gradientBand(w * 0.17, w * 0.20, [
    [0, 'rgba(170,150,120,0.02)'],
    [0.5, 'rgba(160,140,110,0.05)'],
    [1, 'rgba(180,158,128,0.01)'],
  ]);

  // ---- B 环 (最亮, 最密集, 奶油色) ----
  gradientBand(w * 0.20, w * 0.50, [
    [0, 'rgba(190,170,140,0.05)'],
    [0.04, 'rgba(225,200,165,0.65)'],
    [0.18, 'rgba(240,215,180,0.92)'],
    [0.35, 'rgba(238,212,177,0.90)'],
    [0.5, 'rgba(235,210,175,0.85)'],
    [0.65, 'rgba(232,207,172,0.82)'],
    [0.82, 'rgba(225,200,165,0.70)'],
    [0.94, 'rgba(200,178,148,0.25)'],
    [1, 'rgba(140,120,95,0.01)'],
  ]);

  // ---- 卡西尼缝 (Cassini Division, 著名暗隙) ----
  gradientBand(w * 0.50, w * 0.565, [
    [0, 'rgba(80,55,35,0.01)'],
    [0.1, 'rgba(100,75,50,0.06)'],
    [0.3, 'rgba(60,40,22,0.035)'],
    [0.5, 'rgba(50,32,18,0.03)'],
    [0.7, 'rgba(65,42,25,0.04)'],
    [0.9, 'rgba(110,85,60,0.06)'],
    [1, 'rgba(160,135,105,0.01)'],
  ]);

  // ---- A 环 (明亮但次于 B 环, 含恩克缝) ----
  gradientBand(w * 0.565, w * 0.80, [
    [0, 'rgba(170,148,118,0.04)'],
    [0.04, 'rgba(215,190,158,0.55)'],
    [0.18, 'rgba(228,203,170,0.78)'],
    // 恩克缝 (Encke Gap) 区域
    [0.30, 'rgba(230,205,172,0.80)'],
    [0.32, 'rgba(115,90,68,0.06)'],
    [0.335, 'rgba(70,48,30,0.025)'],
    [0.35, 'rgba(200,175,145,0.45)'],
    [0.38, 'rgba(225,200,167,0.72)'],
    // 基勒缝 (Keeler Gap, 更细微)
    [0.50, 'rgba(225,200,167,0.74)'],
    [0.51, 'rgba(130,105,80,0.04)'],
    [0.515, 'rgba(210,185,155,0.60)'],
    [0.7, 'rgba(220,195,163,0.55)'],
    [0.88, 'rgba(200,175,145,0.22)'],
    [1, 'rgba(155,132,105,0.01)'],
  ]);

  // ---- A-F 间隙 ----
  gradientBand(w * 0.80, w * 0.85, [
    [0, 'rgba(140,120,95,0.01)'],
    [0.5, 'rgba(120,100,78,0.03)'],
    [1, 'rgba(145,125,100,0.01)'],
  ]);

  // ---- F 环 (最外层, 纤细暗淡) ----
  gradientBand(w * 0.85, w * 0.95, [
    [0, 'rgba(155,135,108,0.0)'],
    [0.2, 'rgba(200,178,148,0.08)'],
    [0.5, 'rgba(195,173,143,0.06)'],
    [0.8, 'rgba(180,160,132,0.03)'],
    [1, 'rgba(155,135,108,0.0)'],
  ]);

  // ---- 外围淡出 ----
  gradientBand(w * 0.95, w, [
    [0, 'rgba(140,120,95,0.0)'],
    [1, 'rgba(0,0,0,0.0)'],
  ]);

  return new THREE.CanvasTexture(c);
}

/** 生成真实星空天空盒纹理 (4096×2048) */
function createStarfieldTexture(size = 4096) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size / 2;
  const ctx = c.getContext('2d');
  const w = size, h = size / 2;

  // 深空背景
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, w, h);

  // 银河带 (横跨赤道区域)
  const mwGrad = ctx.createLinearGradient(0, 0, 0, h);
  mwGrad.addColorStop(0, 'rgba(8,8,30,0)');
  mwGrad.addColorStop(0.15, 'rgba(10,10,35,0.3)');
  mwGrad.addColorStop(0.35, 'rgba(15,12,45,0.7)');
  mwGrad.addColorStop(0.45, 'rgba(20,15,55,0.85)');
  mwGrad.addColorStop(0.5, 'rgba(22,16,58,0.9)');
  mwGrad.addColorStop(0.55, 'rgba(20,15,55,0.85)');
  mwGrad.addColorStop(0.65, 'rgba(15,12,45,0.7)');
  mwGrad.addColorStop(0.85, 'rgba(10,10,35,0.3)');
  mwGrad.addColorStop(1, 'rgba(8,8,30,0)');
  ctx.fillStyle = mwGrad;
  ctx.fillRect(0, 0, w, h);

  // 银河暗色尘埃带
  for (let i = 0; i < 40; i++) {
    const y = h * (0.25 + Math.random() * 0.5);
    const bandW = 40 + Math.random() * 80;
    ctx.beginPath();
    ctx.moveTo(0, y + (Math.random() - 0.5) * 25);
    for (let x = 0; x < w; x += w / 20) {
      ctx.lineTo(x, y + (Math.random() - 0.5) * bandW);
    }
    ctx.strokeStyle = `rgba(5,5,20,${Math.random() * 0.3})`;
    ctx.lineWidth = 6 + Math.random() * 30;
    ctx.stroke();
  }

  // 恒星光谱分布: ~76% M型(红矮星), ~12% K型(橙), ~7.5% G型(黄), ~3% F型(白), ~1.5% A型(蓝白)
  const starTypes = [
    { type: 'M', color: [255, 180, 140], pct: 0.40, magRange: [0.05, 0.3], sizeRange: [0.5, 1.5] },
    { type: 'K', color: [255, 210, 170], pct: 0.25, magRange: [0.1, 0.5], sizeRange: [0.8, 2.0] },
    { type: 'G', color: [255, 245, 220], pct: 0.18, magRange: [0.15, 0.7], sizeRange: [1.0, 2.5] },
    { type: 'F', color: [240, 245, 255], pct: 0.10, magRange: [0.3, 0.85], sizeRange: [1.2, 3.0] },
    { type: 'A', color: [200, 215, 255], pct: 0.05, magRange: [0.5, 1.0], sizeRange: [1.5, 3.5] },
    { type: 'B', color: [170, 190, 255], pct: 0.02, magRange: [0.7, 1.0], sizeRange: [2.0, 4.5] },
  ];

  let starCount = 0;
  starTypes.forEach(st => {
    const count = Math.floor(8000 * st.pct);
    for (let i = 0; i < count; i++) {
      const x = Math.random() * w;
      // 银河带区域星星更密
      let y;
      const galCenter = h / 2;
      if (Math.random() < 0.55) {
        // 集中在银河带
        y = galCenter + (Math.random() - 0.5) * h * 0.5;
      } else {
        y = Math.random() * h;
      }

      const mag = st.magRange[0] + Math.random() * (st.magRange[1] - st.magRange[0]);
      const sz = st.sizeRange[0] + Math.random() * (st.sizeRange[1] - st.sizeRange[0]);

      // 更亮的星更大
      const finalSize = sz * mag;

      ctx.beginPath();
      ctx.arc(x, y, finalSize, 0, Math.PI * 2);
      const [cr, cg, cb] = st.color;
      ctx.fillStyle = `rgba(${cr},${cg},${cb},${mag})`;
      ctx.fill();

      // 亮星加十字光芒
      if (mag > 0.75 && Math.random() < 0.3) {
        const glowR = finalSize * 3;
        const glowGrad = ctx.createRadialGradient(x, y, finalSize, x, y, glowR);
        glowGrad.addColorStop(0, `rgba(${cr},${cg},${cb},${mag * 0.7})`);
        glowGrad.addColorStop(0.5, `rgba(${cr},${cg},${cb},${mag * 0.2})`);
        glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(x, y, glowR, 0, Math.PI * 2);
        ctx.fillStyle = glowGrad;
        ctx.fill();
      }
      starCount++;
    }
  });

  // 额外散布在银河带的细小星点
  for (let i = 0; i < 6000; i++) {
    const x = Math.random() * w;
    const y = h/2 + (Math.random() - 0.5) * h * 0.45;
    const sz = 0.3 + Math.random() * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, sz, 0, Math.PI * 2);
    const b = 100 + Math.floor(Math.random() * 155);
    ctx.fillStyle = `rgba(${b},${b},${b + Math.floor(Math.random()*30)},${0.1 + Math.random()*0.4})`;
    ctx.fill();
  }

  return new THREE.CanvasTexture(c);
}

/** 生成星芒sprite纹理 */
function createStarSpriteTex() {
  const c = document.createElement('canvas');
  c.width = 32; c.height = 32;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.08, 'rgba(255,255,255,0.95)');
  grad.addColorStop(0.2, 'rgba(220,235,255,0.6)');
  grad.addColorStop(0.4, 'rgba(150,180,220,0.15)');
  grad.addColorStop(0.7, 'rgba(50,80,150,0.02)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
}

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r: 128, g: 128, b: 128 };
}

function clamp(v, min = 0, max = 255) {
  return Math.min(max, Math.max(min, Math.round(v)));
}

  const starSprite = createStarSpriteTex();
  const brightStars = [
    { pos: [45, 55, 80], color: 0xffffff, size: 1.8 },   // 天狼星
    { pos: [-70, 40, -50], color: 0xffeedd, size: 1.5 },

  ];

  brightStars.forEach(star => {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: starSprite,
      color: star.color,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      transparent: true,
      opacity: 0.85,
    }));
    sprite.position.set(...star.pos);
    sprite.scale.setScalar(star.size);
    starfieldGroup.add(sprite);
  });

  // ---- 3) 散布的中等亮度星点层 ----
  const medStarsCount = 800;
  const medPositions = new Float32Array(medStarsCount * 3);
  const medColors = new Float32Array(medStarsCount * 3);
  for (let i = 0; i < medStarsCount; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 130 + Math.random() * 30;

    else if (tempRand < 0.20) { cr = 0.9; cg = 0.95; cb = 1.0; }

    const brightness = 0.4 + Math.random() * 0.6;
    medColors[i * 3] = cr * brightness;
    medColors[i * 3 + 1] = cg * brightness;
    medColors[i * 3 + 2] = cb * brightness;
  }

  const medGeo = new THREE.BufferGeometry();
  medGeo.setAttribute('position', new THREE.BufferAttribute(medPositions, 3));
  medGeo.setAttribute('color', new THREE.BufferAttribute(medColors, 3));
  const medMat = new THREE.PointsMaterial({
    map: starSprite,

    depthWrite: false,
    transparent: true,
    vertexColors: true,
    sizeAttenuation: true,

  scene.add(starfieldGroup);
  return starfieldGroup;
}

[{color:'rgba(255,60,40,0.25)',x:1.8},{color:'rgba(80,220,80,0.18)',x:-1.5},{color:'rgba(60,100,255,0.2)',x:0.9}].forEach(d => {

// 更新 flarer 尺寸/透明度跟随视角距离
function updateFlareVisibility() {
  const dist = camera.position.length();
  const vis = THREE.MathUtils.clamp(1 - (dist - 8) / 130, 0.1, 1);
  lensFlareGroup.children.forEach(c => {

// ==================== 创建行星 ====================
const planets = [];
const orbitGroups = [];
const clickableObjects = [sunMesh];
const orbitLines = [];     // 存储所有轨道线引用
const labelSprites = [];   // 存储所有行星标签精灵

planetData.forEach((data) => {
  const orbitGroup = new THREE.Group();
  orbitGroup.name = `${data.name}轨道`;
  scene.add(orbitGroup);
  orbitGroups.push({ group: orbitGroup, speed: data.orbitSpeed });

  // 生成纹理 (提升分辨率)
  let texture;
  if (data.name === '地球') {
    texture = createRockyTexture(data.color, 'earth', 1024);
  } else if (data.name === '火星') {
    texture = createRockyTexture(data.color, 'mars', 512);
  } else if (data.name === '金星') {
    texture = createRockyTexture(data.color, 'venus', 512);
  } else if (['木星', '土星', '天王星', '海王星'].includes(data.name)) {
    texture = createGasGiantTexture(getBandColors(data.name), 1024);
  } else {
    texture = createRockyTexture(data.color, 'default', 512);
  }
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = maxAniso;

  // 行星网格体
  const segments = data.radius > 2 ? 72 : 48;
  const planetGeo = new THREE.SphereGeometry(data.radius, segments, segments / 2);
  const planetMat = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: data.roughness || 0.7,
    metalness: data.metalness || 0.05,
  });
  const planetMesh = new THREE.Mesh(planetGeo, planetMat);
  planetMesh.castShadow = true;
  planetMesh.receiveShadow = true;
  planetMesh.name = data.name;
  planetMesh.userData = data;

  // 地球使用 pivot 容器以支持月球轨道 (月球绕地球公转，不受地球自转影响)
  if (data.name === '地球') {
    const earthPivot = new THREE.Group();
    earthPivot.position.set(data.distance, 0, 0);
    orbitGroup.add(earthPivot);
    planetMesh.position.set(0, 0, 0);
    earthPivot.add(planetMesh);
    planetMesh.userData._earthPivot = earthPivot;
  } else {
    planetMesh.position.set(data.distance, 0, 0);
    orbitGroup.add(planetMesh);
  }
  clickableObjects.push(planetMesh);

  // 土星环 (真实环带系统: D/C/B/卡西尼缝/A/恩克缝/F环)
  if (data.hasRings) {
    const ringTex = createRingTexture();
    ringTex.colorSpace = THREE.SRGBColorSpace;
    ringTex.anisotropy = maxAniso;
    const ringGeo = new THREE.RingGeometry(data.radius * 1.3, data.radius * 2.3, 200);
    // UV 映射: u = 径向距离(0=内缘,1=外缘), v = 0.5
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    const innerR = data.radius * 1.3;
    const outerR = data.radius * 2.3;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      const dist = Math.sqrt(x * x + y * y);
      uv.setXY(i, (dist - innerR) / (outerR - innerR), 0.5);
    }

    const ringMat = new THREE.MeshStandardMaterial({
      map: ringTex,
      side: THREE.DoubleSide,
      transparent: true,
      roughness: 0.55,
      metalness: 0.05,
      depthWrite: true,
      alphaTest: 0.02,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2 + 0.45; // 土星轴倾斜 26.7°
    ring.castShadow = true;
    ring.receiveShadow = true;
    ring.raycast = () => {}; // 环不拦截射线（点击穿透到行星）
    planetMesh.add(ring);
  }

  // 轨道引导线
  const orbitPoints = [];
  const orbitSegs = 256;
  for (let i = 0; i <= orbitSegs; i++) {
    const angle = (i / orbitSegs) * Math.PI * 2;
    orbitPoints.push(new THREE.Vector3(
      Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance
    ));
  }
  const orbitLineGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
  const orbitLineMat = new THREE.LineBasicMaterial({
    color: 0x4FC3FF,
    transparent: true,
    opacity: 0.7,
    depthTest: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const orbitLine = new THREE.Line(orbitLineGeo, orbitLineMat);
  scene.add(orbitLine);
  orbitLines.push(orbitLine);

  // 存储引用
  planets.push({
    mesh: planetMesh,
    orbitGroup,
    rotSpeed: data.rotSpeed,
    orbitSpeed: data.orbitSpeed,
    data,
  });
});

function createLabelSprite(text, color = '#ffffff') {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 轻微阴影提高可读性
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 6;
  ctx.fillText(text, 128, 32);
  ctx.shadowBlur = 0;

  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex,
    depthTest: true,
    depthWrite: false,
    transparent: true,
  }));
  sprite.scale.set(5, 1.25, 1);
  sprite.visible = false; // 默认隐藏，通过按钮切换
  return sprite;
}

// ==================== 射线检测 ====================
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 1;
raycaster.params.Line = { threshold: 0.5 };

const mouse = new THREE.Vector2();
let hoveredObject = null;

function updateMouse(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

window.addEventListener('mousemove', (event) => {
  updateMouse(event);
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(clickableObjects);

  // 每帧重置所有轨道线为默认颜色
  orbitLines.forEach(l => { l.material.color.set(0x4FC3FF); l.material.opacity = 0.7; });

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    if (hoveredObject !== obj) {
      if (hoveredObject?.material?.emissive?.setHex) {
        hoveredObject.material.emissive.setHex(0x000000);
      }
      hoveredObject = obj;
      document.body.style.cursor = 'pointer';
      if (obj.material?.emissive?.setHex) {
        obj.material.emissive.setHex(0x222222);
      }
    }
    // 悬停行星 → 高亮对应轨道线
    const pidx = planets.findIndex(p => p.mesh === obj);
    if (pidx >= 0 && orbitLines[pidx]) {
      orbitLines[pidx].material.color.set(0x00FFFF);
      orbitLines[pidx].material.opacity = 1.0;
    }
  } else {
    if (hoveredObject?.material?.emissive?.setHex) {
      hoveredObject.material.emissive.setHex(0x000000);
    }
    hoveredObject = null;
    document.body.style.cursor = 'grab';
  }
});

// 双击检测状态
let clickTimer = null;
let lastClickedObj = null;

function findPlanetEntry(obj) {
  // 在 planets 数组中查找匹配的行星条目
  return planets.find(p => p.mesh === obj) || (moonObj && moonObj.mesh === obj ? { mesh: moonObj.mesh, data: moonObj.mesh.userData } : null);
}

window.addEventListener('click', (event) => {
  if (event.target.closest('#info-panel') || event.target.closest('#ctrl-bar')) return;
  updateMouse(event);
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(clickableObjects);

  if (intersects.length > 0) {
    const obj = intersects[0].object;

    // 双击检测 (280ms 内再次点击同一对象)
    if (clickTimer && lastClickedObj === obj) {
      clearTimeout(clickTimer);
      clickTimer = null;
      lastClickedObj = null;

      // 双击 → 飞行到行星
      const entry = findPlanetEntry(obj);
      if (entry) {
        flyToPlanet(entry);
        if (cameraMode === 'orbit') setCameraMode('focus');
      }
      return;
    }

    // 单击 → 延迟执行
    lastClickedObj = obj;
    clickTimer = setTimeout(() => {
      showPlanetInfo(obj);
      // 点击太阳 → 平滑回归太阳中心
      if (obj === sunMesh) { focusOnSun(); }
      // 聚焦/跟随模式下单击切换目标
      if (cameraMode === 'focus' || cameraMode === 'follow') {
        const entry = findPlanetEntry(obj);
        if (entry) {
          if (cameraMode === 'focus') focusOnPlanet(entry);
          else followPlanet(entry);
        }
      }
      clickTimer = null;
      lastClickedObj = null;
    }, 280);
  } else {
    hidePlanetInfo();
    // 点击空白处回到轨道模式
    if (cameraMode === 'focus' || cameraMode === 'follow') {
      setCameraMode('orbit');
    }
  }
});

function lightenColor(hex, factor) {
  const rgb = hexToRgb(hex);
  return `rgb(${clamp(rgb.r*factor)},${clamp(rgb.g*factor)},${clamp(rgb.b*factor)})`;
}
function darkenColor(hex, factor) {
  const rgb = hexToRgb(hex);
  return `rgb(${clamp(rgb.r*factor)},${clamp(rgb.g*factor)},${clamp(rgb.b*factor)})`;
}

// ==================== 相机模式系统 ====================
let cameraMode = 'orbit';   // 'orbit' | 'focus' | 'follow' | 'free'
let focusedPlanet = null;   // 当前聚焦/跟随的行星引用
let lastPlanetPos = null;   // 跟随模式下上一帧的行星位置

// 飞行动画
let flyAnim = null; // { startPos, endPos, startTarget, endTarget, startTime, duration }

// 自由飞行
let freeFlySpeed = 15;
const freeFlyKeys = { w: false, a: false, s: false, d: false, q: false, e: false };
let freeFlyYaw = 0, freeFlyPitch = 0;
let savedOrbitState = null; // 保存进入自由飞行前的 OrbitControls 状态

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function getPlanetWorldPos(entry) {
  const pos = new THREE.Vector3();
  if (entry.mesh) entry.mesh.getWorldPosition(pos);
  return pos;
}

function setCameraMode(mode) {
  cameraMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-mode="${mode}"]`)?.classList.add('active');

  if (mode === 'free') {
    // 保存当前 OrbitControls 状态，以便退出时恢复
    savedOrbitState = {
      position: camera.position.clone(),
      target: controls.target.clone(),
    };
    controls.enabled = false;
    document.body.style.cursor = 'crosshair';
    // 从当前视线方向初始化自由飞行朝向（保持视角不变）
    const lookDir = new THREE.Vector3();
    camera.getWorldDirection(lookDir);
    freeFlyYaw = Math.atan2(lookDir.x, lookDir.z);
    freeFlyPitch = Math.asin(Math.min(0.99, Math.max(-0.99, lookDir.y)));
  } else {
    // 从自由飞行退出 → 恢复之前保存的状态
    if (cameraMode === 'free' && savedOrbitState) {
      camera.position.copy(savedOrbitState.position);
      controls.target.copy(savedOrbitState.target);
      controls.update();
      savedOrbitState = null;
    }
    controls.enabled = true;
    document.body.style.cursor = 'grab';
    if (mode === 'orbit') {
      // 从跟随/聚焦退出 → 平滑回归太阳
      if (cameraMode === 'follow' || cameraMode === 'focus') {
        focusOnSun(); return;
      }
      focusedPlanet = null;
      lastPlanetPos = null;
    }
  }
}

function flyToPlanet(entry) {
  const worldPos = getPlanetWorldPos(entry);
  const radius = entry.data?.radius || 1;
  // 计算合适的目标位置：当前相机方向靠近行星
  const toCamera = camera.position.clone().sub(worldPos).normalize();
  const dist = radius * 8 + 4;
  const endPos = worldPos.clone().add(toCamera.multiplyScalar(dist));
  endPos.y += radius * 1.5;

  flyAnim = {
    startPos: camera.position.clone(),
    endPos,
    startTarget: controls.target.clone(),
    endTarget: worldPos.clone(),
    startTime: performance.now(),
    duration: 1100,
  };

  if (cameraMode !== 'focus' && cameraMode !== 'follow') {
    setCameraMode('focus');
  }
  focusedPlanet = entry;
  lastPlanetPos = worldPos.clone();
  showPlanetInfo(entry.mesh);
}

function focusOnPlanet(entry) {
  focusedPlanet = entry;
  lastPlanetPos = getPlanetWorldPos(entry);
}

function followPlanet(entry) {
  setCameraMode('follow');
  focusedPlanet = entry;
  lastPlanetPos = getPlanetWorldPos(entry);
}

// 自由飞行键盘
window.addEventListener('keydown', (e) => {
  if (cameraMode !== 'free') return;
  const k = e.key.toLowerCase();
  if (k in freeFlyKeys) { freeFlyKeys[k] = true; e.preventDefault(); }
  if (k === 'shift') freeFlySpeed = 40;
});
window.addEventListener('keyup', (e) => {
  if (cameraMode !== 'free') return;
  const k = e.key.toLowerCase();
  if (k in freeFlyKeys) { freeFlyKeys[k] = false; e.preventDefault(); }
  if (k === 'shift') freeFlySpeed = 15;
});

// 自由飞行鼠标环顾
window.addEventListener('mousemove', (e) => {
  if (cameraMode !== 'free' || document.pointerLockElement) return;
  if (e.buttons !== 0) {
    freeFlyYaw -= e.movementX * 0.003;
    freeFlyPitch -= e.movementY * 0.003;
    freeFlyPitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, freeFlyPitch));
  }
});

// 模式按钮事件 (自由飞行支持 toggle)
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const mode = btn.dataset.mode;
    if (mode === 'free' && cameraMode === 'free') {
      // 再次点击自由飞行 → 恢复进入前保存的视角
      if (savedOrbitState) {
        camera.position.copy(savedOrbitState.position);
        controls.target.copy(savedOrbitState.target);
        controls.update();
        savedOrbitState = null;
      }
      setCameraMode('orbit');
      return;
    } else if (mode === 'follow' && cameraMode === 'follow') {
      // 再次点击跟随 → 退出，回归太阳
      focusOnSun();
    } else {
      setCameraMode(mode);
    }
  });
});

// ==================== 空闲检测 & 平滑相机 ====================
let idleTime = 0;
const IDLE_LIMIT = 25; // 秒

function resetIdle() { idleTime = 0; }
['mousemove','click','keydown','wheel'].forEach(evt =>
  window.addEventListener(evt, resetIdle, { passive: true })
);

// 平滑相机状态
let smoothTarget = null; // { endPos, endTarget, startPos, startTarget, startTime, duration }

function focusOnSun() {
  const endPos = new THREE.Vector3(30, 35, 70);
  const endTarget = new THREE.Vector3(0, 0, 0);
  smoothTarget = {
    startPos: camera.position.clone(),
    startTarget: controls.target.clone(),
    endPos, endTarget,
    startTime: performance.now(),
    duration: 2500,
  };
  setCameraMode('orbit');
  focusedPlanet = null;
  lastPlanetPos = null;
  flyAnim = null;
}

// ==================== 标记 Bloom 图层 ====================
sunGroup.traverse(c => c.layers.enable(BLOOM_LAYER));
lensFlareGroup.traverse(c => c.layers.enable(BLOOM_LAYER));
starfield.traverse(c => c.layers.enable(BLOOM_LAYER));
twinkleStars.forEach(s => s.layers.enable(BLOOM_LAYER));
// 其他对象默认仅 layer 0，不受 Bloom 影响

// ==================== 自动巡航 ====================
const tourStops = [
  { name: '太阳', getEntry: () => ({ mesh: sunMesh, data: sunMesh.userData }) },
  { name: '水星', getEntry: () => planets.find(p => p.data.name === '水星') },
  { name: '金星', getEntry: () => planets.find(p => p.data.name === '金星') },
  { name: '地球', getEntry: () => planets.find(p => p.data.name === '地球') },
  { name: '火星', getEntry: () => planets.find(p => p.data.name === '火星') },
  { name: '木星', getEntry: () => planets.find(p => p.data.name === '木星') },
  { name: '土星', getEntry: () => planets.find(p => p.data.name === '土星') },
  { name: '天王星', getEntry: () => planets.find(p => p.data.name === '天王星') },
  { name: '海王星', getEntry: () => planets.find(p => p.data.name === '海王星') },
];

let tourActive = false;
let tourIndex = 0;
let tourWaitTimer = 0;
let tourCameraOffset = null; // 跟随模式下的固定相机偏移
let tourBaseDirection = null; // 偏移方向（单位向量）
let tourBaseDistance = 0;     // 基础偏移距离
let tourZoomFactor = 1.0;     // 缩放倍率（跨行星继承）
const TOUR_ZOOM_MIN = 0.15;
const TOUR_ZOOM_MAX = 6.0;
const TOUR_WAIT = 5.0;
const TOUR_FLY_DURATION = 1500;

function startTour() {
  tourActive = true;
  tourIndex = 0;
  tourWaitTimer = 0;
  tourCameraOffset = null;
  tourBaseDirection = null;
  tourBaseDistance = 0;
  tourZoomFactor = 1.0;
  flyAnim = null;
  smoothTarget = null;
  resetIdle();
  setCameraMode('focus');
  const entry = tourStops[0].getEntry();
  if (entry) { flyToPlanet(entry, TOUR_FLY_DURATION); showPlanetInfo(entry.mesh); }
  document.getElementById('btn-tour').classList.add('active');
}

function stopTour() {
  tourActive = false;
  tourWaitTimer = 0;
  document.getElementById('btn-tour').classList.remove('active');
}

function gotoNextTourStop() {
  tourIndex = (tourIndex + 1) % tourStops.length;
  tourWaitTimer = 0;
  tourCameraOffset = null;
  tourBaseDirection = null;
  tourBaseDistance = 0;
  // tourZoomFactor 保持不变，继承上一站的缩放比例
  const entry = tourStops[tourIndex].getEntry();
  if (entry) { flyToPlanet(entry, TOUR_FLY_DURATION); showPlanetInfo(entry.mesh); }
}

document.getElementById('btn-tour').addEventListener('click', () => {
  if (tourActive) { stopTour(); } else { startTour(); }
});

// 更新 flyToPlanet 支持自定义时长
const originalFlyToPlanet = flyToPlanet;
flyToPlanet = function(entry, duration = 1100) {
  const worldPos = getPlanetWorldPos(entry);
  const radius = entry.data?.radius || 1;
  const toCamera = camera.position.clone().sub(worldPos).normalize();
  const dist = radius * 8 + 4;
  const endPos = worldPos.clone().add(toCamera.multiplyScalar(dist));
  endPos.y += radius * 1.5;

  flyAnim = {
    startPos: camera.position.clone(),
    endPos,
    startTarget: controls.target.clone(),
    endTarget: worldPos.clone(),
    startTime: performance.now(),
    duration,
  };

  if (cameraMode !== 'focus' && cameraMode !== 'follow') {
    setCameraMode('focus');
  }
  focusedPlanet = entry;
  lastPlanetPos = worldPos.clone();
};

// ==================== 控制面板逻辑 ====================
let isPaused = false;
let timeScale = 1.0;
let showOrbits = true;
let showLabels = false;

const btnPlay = document.getElementById('btn-play');
const btnSlower = document.getElementById('btn-slower');
const btnFaster = document.getElementById('btn-faster');
const speedLabel = document.getElementById('speed-label');
const btnOrbits = document.getElementById('btn-orbits');
const btnLabels = document.getElementById('btn-labels');
const btnReset = document.getElementById('btn-reset');

// 轨道按钮初始为 active（默认显示轨道）
btnOrbits.classList.add('active');

function updateSpeedDisplay() {
  speedLabel.textContent = timeScale.toFixed(1) + '×';
}

// ▶ / ⏸ 播放暂停
btnPlay.addEventListener('click', () => {
  isPaused = !isPaused;
  btnPlay.textContent = isPaused ? '⏸' : '▶';
  if (isPaused) {
    btnPlay.classList.add('active');
  } else {
    btnPlay.classList.remove('active');
  }
});

// ⏪ 减速
btnSlower.addEventListener('click', () => {
  const steps = [0.1, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0, 10.0];
  const current = steps.findIndex(s => s >= timeScale);
  const prev = current > 0 ? steps[current - 1] : steps[0];
  timeScale = prev;
  updateSpeedDisplay();
});

// ⏩ 加速
btnFaster.addEventListener('click', () => {
  const steps = [0.1, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 5.0, 10.0];
  const current = [...steps].reverse().findIndex(s => s <= timeScale);
  const nextIdx = steps.length - 1 - current;
  const next = nextIdx < steps.length - 1 ? steps[nextIdx + 1] : steps[steps.length - 1];
  timeScale = next;
  updateSpeedDisplay();
});

// ◎ 切换轨道线
btnOrbits.addEventListener('click', () => {
  showOrbits = !showOrbits;
  orbitLines.forEach(line => { line.visible = showOrbits; });
  btnOrbits.classList.toggle('active', showOrbits);
});

// 🏷 切换标签
btnLabels.addEventListener('click', () => {
  showLabels = !showLabels;
  labelSprites.forEach(sprite => { sprite.visible = showLabels; });
  btnLabels.classList.toggle('active', showLabels);
});

// ↺ 重置
btnReset.addEventListener('click', () => {
  isPaused = false;
  timeScale = 1.0;
  flyAnim = null;
  smoothTarget = null;
  stopTour();
  btnPlay.textContent = '▶';
  btnPlay.classList.remove('active');
  updateSpeedDisplay();
  resetIdle();
  focusOnSun();
});

// 巡航模式下滚轮缩放
window.addEventListener('wheel', (e) => {
  if (!tourActive || flyAnim || smoothTarget) return;
  const zoomSpeed = 0.12;
  tourZoomFactor *= (1 - Math.sign(e.deltaY) * zoomSpeed);
  tourZoomFactor = THREE.MathUtils.clamp(tourZoomFactor, TOUR_ZOOM_MIN, TOUR_ZOOM_MAX);
  resetIdle();
}, { passive: true });

// ==================== 动画循环 ====================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const rawDelta = Math.min(clock.getDelta(), 0.1);
  const delta = isPaused ? 0 : rawDelta * timeScale;
  const elapsed = performance.now() * 0.001;
  const dtSec = rawDelta; // 实际时间增量（用于相机动画）

  // 更新太阳光晕时间（即使暂停也更新，保持光晕脉动）
  glowMat1.uniforms.uTime.value = elapsed;
  glowMat2.uniforms.uTime.value = elapsed;

  // 太阳自转
  sunMesh.rotation.y += delta * 0.3;

  // 更新行星
  planets.forEach(p => {
    p.orbitGroup.rotation.y += p.orbitSpeed * delta;
    p.mesh.rotation.y += p.rotSpeed * delta;
  });

  // 更新月球 (绕地球公转 + 自转)
  if (moonObj) {
    moonObj.orbitGroup.rotation.y += moonObj.orbitSpeed * delta;
    moonObj.mesh.rotation.y += moonObj.rotSpeed * delta;
  }

  // 星空缓慢旋转
  starfield.rotation.y += delta * 0.012;
  starfield.rotation.x += delta * 0.002;

  // ---- 平滑相机过渡 (focusOnSun / 模式切换) ----
  if (smoothTarget) {
    const stElapsed = performance.now() - smoothTarget.startTime;
    const st = Math.min(stElapsed / smoothTarget.duration, 1.0);
    const eased = easeInOutCubic(st);
    camera.position.lerpVectors(smoothTarget.startPos, smoothTarget.endPos, eased);
    controls.target.lerpVectors(smoothTarget.startTarget, smoothTarget.endTarget, eased);
    if (st >= 1) smoothTarget = null;
  }

  // ---- 空闲检测 ----
  if (!flyAnim && !smoothTarget && cameraMode !== 'free' && !tourActive) {
    idleTime += rawDelta;
  }
  if (idleTime > IDLE_LIMIT && cameraMode !== 'orbit') {
    focusOnSun();
    idleTime = 0;
  }

  // ---- 相机模式处理 ----
  // 飞行动画 (平滑过渡优先)
  if (flyAnim && !smoothTarget) {
    const flyElapsed = performance.now() - flyAnim.startTime;
    const t = Math.min(flyElapsed / flyAnim.duration, 1.0);
    const eased = easeInOutCubic(t);
    camera.position.lerpVectors(flyAnim.startPos, flyAnim.endPos, eased);
    controls.target.lerpVectors(flyAnim.startTarget, flyAnim.endTarget, eased);
    if (t >= 1) { flyAnim = null; idleTime = 0; }
  }

  // 跟随模式 (实时跟踪)
  if (cameraMode === 'follow' && focusedPlanet && !smoothTarget && !flyAnim) {
    const worldPos = getPlanetWorldPos(focusedPlanet);
    if (lastPlanetPos) {
      const posDelta = worldPos.clone().sub(lastPlanetPos);
      camera.position.add(posDelta);
    }
    controls.target.copy(worldPos);
    lastPlanetPos = worldPos.clone();
  }

  // 聚焦模式 (仅更新target)
  if (cameraMode === 'focus' && focusedPlanet && !smoothTarget && !flyAnim) {
    const worldPos = getPlanetWorldPos(focusedPlanet);
    controls.target.lerp(worldPos, 0.15);
    lastPlanetPos = worldPos.clone();
  }

  // 自由飞行模式
  if (cameraMode === 'free') {
    const spd = freeFlySpeed * dtSec;
    const forward = new THREE.Vector3(-Math.sin(freeFlyYaw) * Math.cos(freeFlyPitch), Math.sin(freeFlyPitch), -Math.cos(freeFlyYaw) * Math.cos(freeFlyPitch));
    const right = new THREE.Vector3(Math.cos(freeFlyYaw), 0, -Math.sin(freeFlyYaw));
    const up = new THREE.Vector3(0, 1, 0);

    if (freeFlyKeys.w) camera.position.addScaledVector(forward, spd);
    if (freeFlyKeys.s) camera.position.addScaledVector(forward, -spd);
    if (freeFlyKeys.a) camera.position.addScaledVector(right, -spd);
    if (freeFlyKeys.d) camera.position.addScaledVector(right, spd);
    if (freeFlyKeys.q) camera.position.addScaledVector(up, -spd);
    if (freeFlyKeys.e) camera.position.addScaledVector(up, spd);

    // 更新 controls 目标（视线方向前的一点）
    controls.target.copy(camera.position).addScaledVector(forward, 10);
  }

  // 自动巡航：固定偏移跟随行星 + 滚轮缩放
  if (tourActive && !flyAnim && !smoothTarget) {
    tourWaitTimer += rawDelta;
    const currentEntry = tourStops[tourIndex].getEntry();
    if (currentEntry) {
      const worldPos = getPlanetWorldPos(currentEntry);
      const planetR = currentEntry.data?.radius || 1;
      // 飞行结束瞬间：捕获基础偏移方向 + 距离
      if (!tourCameraOffset) {
        tourCameraOffset = camera.position.clone().sub(worldPos);
        tourBaseDistance = tourCameraOffset.length();
        tourBaseDirection = tourCameraOffset.normalize();
      }
      // 限制缩放范围（基于行星半径）
      const minDist = planetR * 1.3;
      const maxDist = planetR * 50;
      const clampedDist = THREE.MathUtils.clamp(tourBaseDistance * tourZoomFactor, minDist, maxDist);
      // 每帧：相机 = 行星位置 + 方向 × 缩放距离
      const targetCamPos = worldPos.clone().add(
        tourBaseDirection.clone().multiplyScalar(clampedDist)
      );
      camera.position.lerp(targetCamPos, 0.15);
      controls.target.lerp(worldPos, 0.2);
    }
    if (tourWaitTimer >= TOUR_WAIT) {
      gotoNextTourStop();
      tourWaitTimer = 0;
    }
  }

  // 动态 Near/Far 平面 (防止近距离裁剪 + 保持深度精度)
  const targetDist = focusedPlanet
    ? camera.position.distanceTo(getPlanetWorldPos(focusedPlanet))
    : camera.position.length();
  const dynNear = Math.max(0.001, targetDist * 0.01);
  const dynFar = Math.max(targetDist * 50, 5000);
  if (Math.abs(camera.near - dynNear) > 0.0001 || Math.abs(camera.far - dynFar) > 1) {
    camera.near = dynNear;
    camera.far = dynFar;
    camera.updateProjectionMatrix();
  }

  // 动态景深焦点
  if (cameraMode === 'focus' && focusedPlanet) {
    const targetDist = camera.position.distanceTo(getPlanetWorldPos(focusedPlanet));
    bokehPass.uniforms['focus'].value = THREE.MathUtils.lerp(
      bokehPass.uniforms['focus'].value, targetDist, 0.05
    );
  } else if (cameraMode === 'follow' && focusedPlanet) {
    const targetDist = camera.position.distanceTo(getPlanetWorldPos(focusedPlanet));
    bokehPass.uniforms['focus'].value = THREE.MathUtils.lerp(
      bokehPass.uniforms['focus'].value, targetDist, 0.05
    );
  } else {
    // 轨道/飞行模式：焦点在场景中心
    bokehPass.uniforms['focus'].value = THREE.MathUtils.lerp(
      bokehPass.uniforms['focus'].value, 25, 0.03
    );
  }

  // 镜头耀斑随距离淡出
  updateFlareVisibility();

  // 闪烁星
  twinkleStars.forEach(s => {
    const ud = s.userData;
    const val = Math.sin(elapsed * ud.speed + ud.phase) * 0.5 + 0.5;
    s.material.opacity = ud.minOpacity + val * (ud.maxOpacity - ud.minOpacity);
  });

  // ---- 选择性 Bloom 渲染 ----
  controls.update();
  // 1) 仅渲染 Bloom 图层 → Bloom Composer 输出发光纹理
  camera.layers.set(BLOOM_LAYER);
  bloomComposer.render();
  camera.layers.enableAll();
  // 2) 渲染所有图层到主 Composer（叠加 Bloom 纹理）
  mainComposer.render();
}

// ==================== 启动 ====================
animate();

console.log('🚀 太阳系 3D 模拟器已就绪 (增强版)');
console.log('  ✨ Bloom辉光后处理已启用');
console.log('  🌌 真实恒星光谱星空 + 银河带');
console.log('  ☀ 多层日冕光晕');
console.log('  🖱 拖拽旋转 | 滚轮缩放 | 右键平移 | 点击查看');
console.log('  ⌨ R=重置 F=俯视 空格=自动旋转 B=切换Bloom [/]=调节强度');
console.log(`  行星: ${planets.length} | 可点击: ${clickableObjects.length} | 纹理分辨率: 最高1024²`);
</script>
